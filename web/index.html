<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voice Starter</title>
  <style>
    :root { --bg:#faf8f5; --card:#fff; --ink:#1d1b18; --muted:#6b665e; --accent:#e4572e; --line:#e7e2da; --user:#f1ede6; }
    @media (prefers-color-scheme: dark) { :root { --bg:#151412; --card:#1e1c19; --ink:#f2efe9; --muted:#a39e95; --line:#34302b; --user:#2a2723; } }
    * { box-sizing: border-box; }
    body { margin:0; font-family: system-ui, "Noto Sans", sans-serif; background:var(--bg); color:var(--ink); }
    main { max-width: 960px; margin: 0 auto; padding: 16px; display:grid; gap:16px; grid-template-columns: 1fr; }
    @media (min-width: 800px) { main { grid-template-columns: 3fr 2fr; } header { grid-column: 1 / -1; } }
    header { display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; }
    h1 { font-size:20px; margin:0; }
    select, input, button { font:inherit; color:inherit; }
    select, input { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
    .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:16px; }
    #log { display:flex; flex-direction:column; gap:10px; min-height:280px; max-height:55vh; overflow-y:auto; }
    .msg { padding:10px 14px; border-radius:14px; max-width:85%; line-height:1.45; }
    .msg.user { align-self:flex-end; background:var(--user); }
    .msg.bot { align-self:flex-start; border:1px solid var(--line); }
    .msg small { display:block; color:var(--muted); font-size:12px; margin-top:4px; }
    #mic { width:96px; height:96px; border-radius:50%; border:none; background:var(--accent); color:#fff; font-size:15px; font-weight:600; cursor:pointer; display:block; margin:16px auto 8px; }
    #mic.rec { animation: pulse 1s infinite; }
    #mic:disabled { opacity:.5; cursor:wait; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 14px rgba(228,87,46,.25); } }
    #status { text-align:center; color:var(--muted); font-size:14px; min-height:20px; }
    form { display:flex; gap:8px; margin-top:12px; }
    form input { flex:1; min-width:0; }
    form button, #reset { border:1px solid var(--line); background:var(--card); border-radius:10px; padding:10px 14px; cursor:pointer; }
    dl { margin:0; display:grid; grid-template-columns:auto 1fr; gap:8px 12px; font-size:14px; }
    dt { color:var(--muted); }
    dd { margin:0; word-break:break-word; }
    .done { color:#2e7d32; font-weight:600; margin-top:12px; }
    .badge { font-size:12px; color:var(--muted); }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Voice Starter</h1>
    <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <select id="track" aria-label="Track"></select>
      <button id="reset">New conversation</button>
    </div>
    <div class="badge" id="modes"></div>
  </header>

  <section class="card">
    <div id="log" aria-live="polite"></div>
    <button id="mic" aria-label="Tap to talk">Tap to talk</button>
    <div id="status"></div>
    <form id="typed">
      <input id="text" placeholder="…or type (useful for testing)" autocomplete="off">
      <button>Send</button>
    </form>
  </section>

  <aside class="card">
    <h2 style="font-size:16px;margin:0 0 12px">Captured so far</h2>
    <dl id="fields"></dl>
    <div id="done"></div>
  </aside>
</main>
<script src="app.js"></script>
</body>
</html>
